name: Feature request
description: Suggest an idea for RunnerTray.
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: Please check the [roadmap](https://github.com/azharudh33n/runner-tray/blob/main/docs/ROADMAP.md) first.
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      description: Describe the situation, not the solution, first.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: Your idea
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: What you do today instead
