# Push a tag like v1.0.0. This workflow tests, builds the installer and portable zip (Velopack),
# and publishes them as a GitHub release. Installed copies update themselves from these releases.
name: Release

on:
  push:
    tags: ["v*"]
    # Dry run: a push to release/1.2.3 builds version 1.2.3 and uploads it as an artifact, publishes nothing.
    branches: ["release/**"]
  # Dry run from the Actions tab: builds everything and uploads it as an artifact, publishes nothing.
  workflow_dispatch:
    inputs:
      version:
        description: Version to build, for example 1.0.0
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            9.0.x

      - name: Version from tag
        shell: pwsh
        run: |
          $v = '${{ inputs.version || github.ref_name }}'.Split('/')[-1].TrimStart('v')
          if ($v -notmatch '^\d+\.\d+\.\d+$') { throw "Tag must look like v1.2.3" }
          "VERSION=$v" >> $env:GITHUB_ENV

      - name: Build and test
        shell: pwsh
        run: |
          dotnet build RunnerTray.sln -c Release -p:Version=$env:VERSION
          dotnet test tests/RunnerTray.Tests -c Release --no-build
          dotnet test tests/RunnerTray.UiTests -c Release --no-build

      - name: Publish app for the installer
        run: dotnet publish src/RunnerTray -c Release -r win-x64 --self-contained true -p:Version=${{ env.VERSION }} -o out/app

      - name: Self-test of the published app
        shell: pwsh
        run: |
          $p = Start-Process out/app/RunnerTray.exe -ArgumentList '--selftest' -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "Self-test failed with exit code $($p.ExitCode)" }

      - name: Build installer and update packages (Velopack)
        shell: pwsh
        run: |
          dotnet tool install -g vpk --version 1.2.161
          # Previous release, so vpk can build a small delta update. Not available for the first release.
          if (-not '${{ github.ref }}'.StartsWith('refs/tags/')) { New-Item -ItemType Directory -Force releases | Out-Null } else {
          vpk download github --repoUrl https://github.com/${{ github.repository }} --token ${{ github.token }} -o releases
          if ($LASTEXITCODE -ne 0) { Write-Host "No earlier Velopack release; building a full package only." ; $global:LASTEXITCODE = 0 } }
          $notes = "release-notes.md"
          $section = (Get-Content CHANGELOG.md -Raw) -split "(?m)^## " | Where-Object { $_ -match "^\[?$env:VERSION\]?" } | Select-Object -First 1
          if ($section) { "## " + $section | Set-Content $notes } else { "RunnerTray $env:VERSION" | Set-Content $notes }
          vpk pack --packId RunnerTray --packVersion $env:VERSION --packDir out/app --mainExe RunnerTray.exe `
            --packTitle RunnerTray --packAuthors "RunnerTray contributors" --icon assets/app.ico --splashImage assets/splash.png `
            --releaseNotes $notes -o releases

      - name: Upload dry-run output
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@v4
        with:
          name: runnertray-${{ env.VERSION }}
          path: |
            releases/*
            release-notes.md

      - name: Publish the GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          vpk upload github --repoUrl https://github.com/${{ github.repository }} --token $env:GH_TOKEN `
            -o releases --publish --releaseName "RunnerTray $env:VERSION" --tag ${{ github.ref_name }}
          gh release edit ${{ github.ref_name }} --notes-file release-notes.md
