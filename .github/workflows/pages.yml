# Publishes the website (site/ plus screenshots) to GitHub Pages:
# https://azharudh33n.github.io/runner-tray/
name: Website

on:
  push:
    branches: [main]
    paths: ["site/**", "docs/*.png", "assets/logo*", "tools/build-site.ps1", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Build site
        shell: pwsh
        run: ./tools/build-site.ps1
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
