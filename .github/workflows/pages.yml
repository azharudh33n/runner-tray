# Publishes the website (site/ plus screenshots) to Cloudflare: https://runnertray.wx8.org/
# Needs two repository secrets: CLOUDFLARE_API_TOKEN (made from Cloudflare's "Edit Cloudflare
# Workers" token template, limited to this account and the wx8.org zone) and CLOUDFLARE_ACCOUNT_ID.
name: Website

on:
  push:
    branches: [main]
    paths: ["site/**", "docs/*.png", "assets/logo*", "assets/brand/**", "tools/build-site.ps1", "wrangler.jsonc", "site-worker/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: website
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: website
      url: https://runnertray.wx8.org/
    steps:
      - uses: actions/checkout@v4
      - name: Build site
        shell: pwsh
        run: ./tools/build-site.ps1
      - name: Deploy to Cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::warning::Not deployed. Add the CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID repository secrets."
            echo "DEPLOYED=false" >> "$GITHUB_ENV"
            exit 0
          fi
          npx --yes wrangler@4 deploy
          echo "DEPLOYED=true" >> "$GITHUB_ENV"
      - name: Check the live site
        if: env.DEPLOYED == 'true'
        run: |
          sleep 10
          curl --fail --silent --show-error --output /dev/null https://runnertray.wx8.org/
          curl --fail --silent --show-error --output /dev/null https://runnertray.wx8.org/sitemap.xml
