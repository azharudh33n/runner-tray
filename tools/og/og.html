<!doctype html>
<!-- Share card template. Render with: pwsh tools/render-og.ps1
     Output: assets/og.png (1200x630, website) and docs/social.png (1280x640, GitHub repo card). -->
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../../site/fonts/fonts.css">
<style>
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 100vw; height: 100vh; overflow: hidden; }
  body {
    background:
      radial-gradient(ellipse 60% 70% at 88% 18%, rgba(242,107,58,.20), transparent 70%),
      radial-gradient(ellipse 50% 60% at 10% 100%, rgba(88,166,255,.10), transparent 70%),
      #0E1525;
    color: #F7F6F2;
    font-family: "IBM Plex Sans", system-ui, sans-serif;
    display: grid; grid-template-columns: 1fr 400px; gap: 48px;
    padding: 56px 56px 0 72px;
  }
  .text { display: flex; flex-direction: column; padding-bottom: 64px; }
  .logo { height: 34px; width: auto; align-self: flex-start; }
  h1 {
    margin-top: auto;
    font: 400 62px/1.03 "Bricolage Grotesque", system-ui, sans-serif;
    font-stretch: 96%; letter-spacing: -0.035em;
  }
  h1 em { font-style: normal; color: #FF8A5C; }
  .sub { margin-top: 26px; font-size: 25px; line-height: 1.4; color: #C9CED8; max-width: 30ch; }
  .meta {
    margin-top: 40px; display: flex; gap: 18px; align-items: center;
    font: 400 19px "JetBrains Mono", ui-monospace, monospace; color: #8A94A6;
  }
  .meta b { color: #F7F6F2; font-weight: 400; }
  .shot { align-self: end; position: relative; }
  .shot img {
    display: block; width: 400px; height: auto;
    border: 1px solid rgba(247,246,242,.14);
    box-shadow: 0 30px 80px rgba(0,0,0,.55);
  }
</style>
</head>
<body>
  <div class="text">
    <img class="logo" src="../../assets/brand/lockup-horizontal-reversed.svg" alt="RunnerTray">
    <h1>Stop checking a browser tab for <em>GitHub&nbsp;Actions</em></h1>
    <p class="sub">Failed runs and offline runners, in the Windows tray.</p>
    <p class="meta"><b>runnertray.wx8.org</b><span>·</span><span>Free, open source</span></p>
  </div>
  <div class="shot"><img src="../../docs/popup.png" alt=""></div>
</body>
</html>
